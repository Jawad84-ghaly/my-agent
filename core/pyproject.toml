[project]
name = "nova-core"
version = "0.1.0"
description = "Core agentique de Nova — assistant exécutif multi-canal"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "cryptography>=43",
  "httpx>=0.27",
  "pydantic>=2.9",
]

[project.optional-dependencies]
agent = ["langgraph>=0.2", "langchain-anthropic>=0.2", "anthropic>=0.39"]
db = ["sqlalchemy>=2.0", "alembic>=1.13", "asyncpg>=0.30", "pgvector>=0.3"]
worker = ["arq>=0.26", "redis>=5.1"]
# Les tests exercent la couche de persistance sur SQLite : sqlalchemy, alembic
# et aiosqlite sont donc requis pour la suite, pas seulement en production.
# arq et redis aussi : core.api.main (le gateway) importe arq au niveau module
# pour créer son pool ARQ au démarrage, donc tester ses routes exige ces deux
# paquets même si les tests eux-mêmes n'ouvrent jamais de connexion Redis.
dev = [
  "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7,<0.16",
  "sqlalchemy>=2.0", "alembic>=1.13", "aiosqlite>=0.20",
  "arq>=0.26", "redis>=5.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Jeu de regles fige explicitement. S'en remettre aux defauts de ruff rend la CI
# dependante de sa version : une montee mineure a suffi a faire passer ce depot
# de 6 a 68 signalements, tous stylistiques. On garde ici ce qui attrape de
# vraies erreurs -- imports morts, noms indefinis, bugs classiques.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "E501",  # longueur de ligne : laissee au formateur
  "B008",  # appel dans une valeur par defaut -- idiome FastAPI (Depends)
]
