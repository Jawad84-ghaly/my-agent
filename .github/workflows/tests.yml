name: tests

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée annule le run en cours sur la même branche :
# inutile de payer deux fois pour un commit déjà remplacé.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Le job ne dépend d'aucun service : la suite tourne hors ligne grâce à
    # FakeTransport, InMemoryCalendar et RecordingSender.
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 3.11 est la version cible ; 3.12 détecte tôt les dépréciations.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: core/pyproject.toml

      - name: Install
        working-directory: core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: core
        run: ruff check core tests

      - name: Format check
        working-directory: core
        run: ruff format --check core tests
        continue-on-error: true  # informatif tant que le formatage n'est pas figé

      - name: Tests
        working-directory: core
        run: pytest -q --tb=short
